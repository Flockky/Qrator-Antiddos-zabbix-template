              value: application/json
            - name: X-Qrator-Auth
              value: '{$QRATOR.AUTH_TOKEN}'
          request_method: POST
          tags:
            - tag: 'Get data'
        - uuid: 838b9eceb5244e64b0bf762293d21ef8
          name: 'statistics_current_locations TEST'
