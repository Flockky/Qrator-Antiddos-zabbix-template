            - tag: 'Get data'
        - uuid: f36975d20c3c488e8370a35af733275d
          name: statistics_current_locations
          type: HTTP_AGENT
          key: statistics_current_locations
          delay: 0;m/1
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  try {
                      var data = JSON.parse(value);
                      var lld = [];
                  
                      // Проверяем, есть ли result
                      if (data && data.result) {
                          // Перебираем все сервисы (ID)
                          for (var serviceId in data.result) {
                              if (data.result.hasOwnProperty(serviceId)) {
                                  var serviceData = data.result[serviceId];
                                  
                                  var ruCount = 0;
                                  var notRuCount = 0;
                                  
                                  // Проверяем наличие объекта locations
                                  if (serviceData && serviceData.locations) {
                                      var locs = serviceData.locations;
                                      
                                      // Перебираем локации, если они есть
                                      for (var locCode in locs) {
                                          if (locs.hasOwnProperty(locCode)) {
                                              var count = Number(locs[locCode]);
                                              
                                              // Суммируем RU и остальные
                                              if (locCode.toUpperCase() === 'RU') {
                                                  ruCount += count;
                                              } else {
                                                  notRuCount += count;
                                              }
                                          }
                                      }
                                  }
                                  
                                  // Округляем ВВЕРХ до целого (Math.ceil)
                                  // Если было 0.1 -> станет 1
                                  // Если было 0 -> останется 0 (так как ceil(0) = 0)
                                  var finalRu = Math.ceil(ruCount);
                                  var finalNotRu = Math.ceil(notRuCount);
                  
                                  // Добавляем в вывод
                                  lld.push({
                                      "id": serviceId,
                                      "ru_count": String(finalRu),
                                      "not_ru_count": String(finalNotRu)
                                  });
                              }
                          }
                      }
                  
                      return JSON.stringify({"data": lld});
                  } catch (error) {
                      throw new Error("JS preprocessing failed: " + error.message);
                  }
            - type: JSONPATH
              parameters:
                - $.data
          url: 'https://api.qrator.net/request/client/{$QRATOR.CLIENT_ID}'
          post_type: JSON
          posts: '{"method":"statistics_current_locations"}'
          headers:
