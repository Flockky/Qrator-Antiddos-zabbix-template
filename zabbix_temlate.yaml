        - uuid: a6bbc23bcedf4efbbaa16af0fe121450
          name: qrator_domains_get
          type: HTTP_AGENT
          key: qrator_domains_get
          delay: 0;h/1
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.result
            - type: JAVASCRIPT
              parameters:
                - |
                  try {
                      // Парсим входящий JSON
                      var data = JSON.parse(value);
                  
                      // Проходим по каждому элементу массива
                      for (var i = 0; i < data.length; i++) {
                          var item = data[i];
                          var has443 = 0;
                  
                          // Проверяем, существует ли массив services
                          if (item.services && Array.isArray(item.services)) {
                              // Ищем хотя бы один сервис с портом 443
                              for (var j = 0; j < item.services.length; j++) {
                                  if (item.services[j].port === 443) {
                                      has443 = 1;
                                      break; // Если нашли, дальше искать не нужно
                                  }
                              }
                          }
                  
                          // Добавляем новое поле
                          item.have_443 = has443;
                      }
                  
                      // Возвращаем измененный объект в виде строки JSON
                      return JSON.stringify(data);
                  } catch (e) {
                      // В случае ошибки возвращаем оригинальное значение или сообщение об ошибке
                      return 'Error processing JSON: ' + e.message;
                  }
          url: 'https://api.qrator.net/request/client/{$QRATOR.CLIENT_ID}'
          post_type: JSON
          posts: '{"method":"domains_get"}'
          headers:
            - name: Content-Type
              value: application/json
            - name: X-Qrator-Auth
              value: '{$QRATOR.AUTH_TOKEN}'
          request_method: POST
          tags:
            - tag: 'Get data'
        - uuid: 7431633868794e7ebdd2f507db1d3d24
          name: '["all"]. Total RPS'
          type: CALCULATED
          key: requests.all
          delay: 0;m/1
          value_type: FLOAT
          units: rps
          params: 'sum(last_foreach(//requests[*]))'
        - uuid: 72790bdcddd54d7dbfcdc1477404dad6
          name: statistics_current_http
          type: HTTP_AGENT
          key: statistics_current_http
          delay: 0;m/1
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.result
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var result = [];
                  
                  // Проходим по всем ключам объекта (это наши ID)
                  for (var id in data) {
                      if (data.hasOwnProperty(id)) {
                          // Берем объект метрик
                          var metrics = data[id];
                          
                          // Добавляем ID внутрь объекта, чтобы он стал доступен как макрос
                          metrics.id = id;
                          
                          // Кладем в итоговый массив
                          result.push(metrics);
                      }
                  }
                  
                  return JSON.stringify(result);
          url: 'https://api.qrator.net/request/client/{$QRATOR.CLIENT_ID}'
          post_type: JSON
          posts: '{"method":"statistics_current_http"}'
          headers:
            - name: Content-Type
              value: application/json
            - name: X-Qrator-Auth
              value: '{$QRATOR.AUTH_TOKEN}'
          request_method: POST
          tags:
            - tag: 'Get data'
        - uuid: 91dca9c466b048609d12685fad476fe3
          name: statistics_current_ip
          type: HTTP_AGENT
          key: statistics_current_ip
          delay: 0;m/1
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.result
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var result = [];
                  
                  // Проходим по всем ключам объекта (это наши ID)
                  for (var id in data) {
                      if (data.hasOwnProperty(id)) {
                          // Берем объект метрик
                          var metrics = data[id];
                          
                          // Добавляем ID внутрь объекта, чтобы он стал доступен как макрос
                          metrics.id = id;
                          
                          // Кладем в итоговый массив
                          result.push(metrics);
                      }
                  }
                  
                  return JSON.stringify(result);
            - type: JAVASCRIPT
              parameters:
                - |
                  try {
                      var data = JSON.parse(value);
                  
                      if (!Array.isArray(data)) {
                          throw new Error("Input is not an array");
                      }
                  
                      data.forEach(function(item) {
                          // Обработка секции packets
                          if (item.packets && typeof item.packets === 'object') {
                              var p_passed = item.packets.passed;
                              var p_input = item.packets.input;
                              
                              // Проверка на деление на ноль
                              if (p_passed && p_passed !== 0) {
                                  item.packets.diff = p_input / p_passed;
                              } else {
                                  item.packets.diff = 0;
                              }
                          }
                  
                          // Обработка секции bandwidth
                          if (item.bandwidth && typeof item.bandwidth === 'object') {
                              var b_passed = item.bandwidth.passed;
                              var b_input = item.bandwidth.input;
                  
                              // Проверка на деление на ноль
                              if (b_passed && b_passed !== 0) {
                                  item.bandwidth.diff = b_input / b_passed;
                              } else {
                                  item.bandwidth.diff = 0;
                              }
                          }
                      });
                  
                      return JSON.stringify(data);
                  } catch (error) {
                      throw new Error("JS preprocessing failed: " + error.message);
                  }
          url: 'https://api.qrator.net/request/client/{$QRATOR.CLIENT_ID}'
          post_type: JSON
          posts: '{"method":"statistics_current_ip"}'
          headers:
            - name: Content-Type
              value: application/json
